name: calibre-agent-release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  # The suite runs here, once, and every build job needs this one -- so a
  # failing test stops the release before the tag moves or anything is built.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: flutter test

  prepare:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Push version tag
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ steps.version.outputs.version }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # `if:` conditions cannot reference the secrets context directly, so
      # gate signing/notarization steps on this instead.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: dart run flutter_launcher_icons

      # Only a push to main (or a same-repo PR) carries these secrets; a
      # fork PR builds ad-hoc/unsigned exactly as before, so contributor CI
      # never fails for lacking a certificate it was never meant to have.
      # No provisioning profile needed: calibre_agent's entitlements don't
      # include keychain-access-groups, the one thing that forces Manual
      # signing to demand one even for Developer ID (see nightmail's
      # release.yml).
      - name: Import Developer ID signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # The keychain only lives for this job, so any random password will do.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Patch the checked-out (not committed) pbxproj so Release actually
          # signs with the Developer ID identity just imported. Left alone,
          # Release stays CODE_SIGN_STYLE=Automatic with no DEVELOPMENT_TEAM,
          # i.e. ad-hoc -- exactly what an unsigned/fork run should still get.
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("macos/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          anchor = "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;\n"
          assert text.count(anchor) == 1, "Release Runner build-settings anchor not found or not unique -- pbxproj layout changed, update this patch"
          replacement = (
              "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Developer ID Application\";\n"
              "\t\t\t\tCODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO;\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = 69XRMYD9XG;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = YES;\n"
              "\t\t\t\tOTHER_CODE_SIGN_FLAGS = \"--timestamp\";\n"
          )
          text = text.replace(anchor, replacement)

          # TargetAttributes.ProvisioningStyle is a separate, higher-precedence
          # setting Xcode's own UI maintains; per-config CODE_SIGN_STYLE alone
          # doesn't override it, so it has to move to Manual too.
          old_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Automatic;\n"
          assert text.count(old_attr) == 1, "ProvisioningStyle anchor not found or not unique"
          new_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Manual;\n"
          text = text.replace(old_attr, new_attr)

          path.write_text(text)
          EOF

      - run: flutter build macos --release --no-tree-shake-icons
      - name: Rename app bundle
        run: mv "build/macos/Build/Products/Release/Calibre Agent.app" build/macos/Build/Products/Release/calibre-agent.app

      - name: Notarize and staple
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/calibre-agent.app"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/calibre-agent-notarize.zip"
          # --wait exits 0 once Apple responds at all, Accepted or Invalid --
          # a rejection is not a CLI failure, so the status has to be checked
          # explicitly rather than relying on notarytool's own exit code.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/calibre-agent-notarize.zip" \
            --key "$RUNNER_TEMP/notary_key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did not succeed -- fetching the detailed log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: Remove signing keychain
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # create-dmg is called directly rather than through
      # lethja/create-dmg-action, which derives *three* things from its one
      # `name` input: the output file, `--volname`, and `--icon <name>.app` —
      # and that last one names the bundle **inside** the volume, which Finder
      # then has to find to position it. So the version can't be added to the
      # file name without also claiming the app is called
      # `calibre-agent-<version>.app`, which fails with "Can't set item ...
      # (-10006)". The app bundle was already renamed to `calibre-agent.app`
      # above, so its name here is fixed rather than resolved from disk.
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Calibre Agent ${{ env.VERSION }}" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "calibre-agent.app" 200 185 \
            --app-drop-link 600 185 \
            "calibre-agent-${{ env.VERSION }}.dmg" \
            "build/macos/Build/Products/Release/calibre-agent.app"
      - name: Create Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: 'calibre-agent-${{ env.VERSION }}.dmg'
          name: 'calibre-agent-${{ env.VERSION }}'
          tag_name: ${{ env.VERSION }}

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y ninja-build libgtk-3-dev binutils coreutils desktop-file-utils fakeroot fuse libgdk-pixbuf-2.0-dev patchelf python3-pip python3-setuptools squashfs-tools strace util-linux zsync libavahi-client-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter create --platforms=linux .
      - run: flutter build linux --release
      - name: Copy icon into bundle
        run: cp assets/icon_512.png build/linux/x64/release/bundle/au.com.sharpblue.calibreagent.png
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Configure Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Create Flatpak bundle
        run: |
          cat > au.com.sharpblue.calibreagent.yaml <<'EOF'
          app-id: au.com.sharpblue.calibreagent
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: calibre_agent
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=fallback-x11
            - --socket=wayland
            - --device=dri
            - --filesystem=home
          modules:
            - name: calibre-agent
              buildsystem: simple
              build-commands:
                - install -Dm755 calibre_agent /app/bin/calibre_agent
                - cp -r lib /app/lib
                - cp -r data /app/data
                - install -Dm644 au.com.sharpblue.calibreagent.desktop /app/share/applications/au.com.sharpblue.calibreagent.desktop
                - install -Dm644 au.com.sharpblue.calibreagent.png /app/share/icons/hicolor/512x512/apps/au.com.sharpblue.calibreagent.png
              sources:
                - type: dir
                  path: build/linux/x64/release/bundle
                - type: file
                  path: au.com.sharpblue.calibreagent.desktop
          EOF

          cat > au.com.sharpblue.calibreagent.desktop <<'EOF'
          [Desktop Entry]
          Name=Calibre Agent
          Exec=calibre_agent
          Icon=au.com.sharpblue.calibreagent
          Type=Application
          Categories=Office;
          Terminal=false
          EOF

          flatpak-builder --force-clean --repo=repo build-dir au.com.sharpblue.calibreagent.yaml
          flatpak build-bundle repo calibre-agent-${VERSION}-linux-x86_64.flatpak au.com.sharpblue.calibreagent
      - name: Upload Linux Flatpak to Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: ${{ env.VERSION }}
          files: calibre-agent-${{ env.VERSION }}-linux-x86_64.flatpak

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: choco install innosetup --no-progress -y
      - run: flutter config --enable-windows-desktop
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --no-tree-shake-icons
      - run: dart run windows.dart
      - name: Create Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'calibre-agent-${{ env.VERSION }}'
          files: 'build/windows/calibre-agent-${{ env.VERSION }}.exe'
          tag_name: ${{ env.VERSION }}
